<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Valorant DOM</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="titulo">
        Vandal
    </h1>

    <button id="botonTitulo">
        Cambiar arma
    </button>

    <br><br>

    <p id="parrafo">
        La Vandal es una de las armas mas usadas de Valorant.
    </p>

    <button id="botonParrafo">
        Cambiar descripcion
    </button>

    <br><br>

    <img
    id="imagen"
    src="https://imgs.search.brave.com/Bw5uHuTnYaD2VSkeusjgIQh7nDPuw5D44lVyJLW_5G0/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9kZXNp/Z25lZGJ5M2QuY29t/L3dwLWNvbnRlbnQv/dXBsb2Fkcy8yMDIy/LzEwL1ZhbmRhbC1w/cmltZS1WQUxPUkFO/VC0xLTEucG5nLnBh/Z2VzcGVlZC5jZS50/WTAwbXdTaGpsLnBu/Zw"
    width="250">

    <br><br>

    <button id="botonImagen">
        Cambiar skin
    </button>

    <br><br>

    <input
    type="text"
    id="textoUsuario"
    placeholder="Escribe un arma">

    <button id="mostrarTexto">
        Mostrar arma
    </button>

    <p id="resultadoTexto"></p>

    <hr>

    <h3>
        Estilo de la pagina
    </h3>

    <button id="modoClaro">
        Modo claro
    </button>

    <button id="modoOscuro">
        Modo oscuro
    </button>

    <hr>

    <h3>
        Lista de armas
    </h3>

    <ul id="lista">
        <li>Vandal</li>
    </ul>

    <button id="agregarElemento">
        Agregar arma
    </button>

    <hr>

    <h2>
        Formulario de jugador
    </h2>

    <form id="formulario">

        <input
        type="text"
        id="nombre"
        placeholder="Nombre del jugador">

        <br><br>

        <input
        type="text"
        id="color"
        placeholder="Color favorito">

        <br><br>

        <textarea
        id="mensaje"
        placeholder="Arma favorita"></textarea>

        <br><br>

        <button type="submit">
            Enviar
        </button>

    </form>

    <p id="error"></p>

    <div id="datos"></div>

    <div id="tarjetas"></div>

    <script src="script.js"></script>

</body>
</html>
